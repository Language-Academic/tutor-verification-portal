<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Portal | Secure Activation</title>
    <style>
        :root {
            --success-green: #28a745;
            --pesapal-orange: #ff5722;
            --pesapal-hover: #e64a19;
            --bg-gray: #f4f7f6;
            --text-main: #333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-gray); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }

        h2 { color: var(--text-main); margin-bottom: 15px; font-size: 22px; }
        p.sub-v { color: #666; font-size: 14px; margin-bottom: 20px; }

        .amount-box { 
            font-size: 24px; 
            font-weight: 800; 
            color: var(--success-green); 
            text-align: center; 
            margin: 10px 0 20px 0;
            padding: 12px;
            background: #f0fff4;
            border-radius: 6px;
            border: 1px solid #dcf6e3;
        }

        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; font-weight: 700; color: #555; margin-bottom: 5px; display: block; text-transform: uppercase; }

        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px;
            background: #fff;
        }

        input:focus, select:focus { outline: none; border-color: var(--pesapal-orange); }

        .hint { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.4; }

        button { 
            width: 100%; 
            padding: 16px; 
            background: var(--pesapal-orange); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-top: 10px;
        }

        button:hover { background: var(--pesapal-hover); transform: translateY(-1px); }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .secure-badge {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Account Activation</h2>
    <p class="sub-v">Complete the form below to unlock full access.</p>
    
    <div class="amount-box" id="displayAmount">KES 100.00</div>

    <!-- Registration Fields (Required for Backend) -->
    <div style="display: flex; gap: 10px;">
        <div class="input-group">
            <label>First Name</label>
            <input type="text" id="fname" placeholder="John" required>
        </div>
        <div class="input-group">
            <label>Last Name</label>
            <input type="text" id="lname" placeholder="Doe" required>
        </div>
    </div>

    <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
    </div>

    <div class="input-group">
        <label>Country / Region</label>
        <select id="country" onchange="updateRegionalSettings()">
            <option value="Kenya">Kenya</option>
            <option value="Uganda">Uganda</option>
            <option value="Tanzania">Tanzania</option>
            <option value="Rwanda">Rwanda</option>
        </select>
    </div>

    <div class="input-group">
        <label>Mobile Money Number</label>
        <input type="text" id="phone" placeholder="e.g. 254712345678" required>
        <p class="hint" id="phoneHint">Include country code (e.g., 254...)</p>
    </div>
    
    <button id="payBtn" onclick="processPayment()">Pay & Activate Now</button>

    <div class="secure-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Secured by PesaPal 3.0 Encryption
    </div>
</div>

<script>
    // 1. Regional Pricing Configuration
    const regionalSettings = {
        'Kenya': { currency: 'KES', amount: '100.00', hint: 'Safaricom/Airtel (e.g., 254...)' },
        'Uganda': { currency: 'UGX', amount: '3,000.00', hint: 'MTN/Airtel (e.g., 256...)' },
        'Tanzania': { currency: 'TZS', amount: '2,000.00', hint: 'Vodacom/Tigo (e.g., 255...)' },
        'Rwanda': { currency: 'RWF', amount: '1,000.00', hint: 'MTN/Airtel (e.g., 250...)' }
    };

    // 2. Pre-fill data if user already registered in index.html
    window.onload = () => {
        document.getElementById('fname').value = localStorage.getItem('tutorFname') || '';
        document.getElementById('lname').value = localStorage.getItem('tutorLname') || '';
        document.getElementById('email').value = localStorage.getItem('tutorEmail') || '';
        document.getElementById('country').value = localStorage.getItem('tutorCountry') || 'Kenya';
        updateRegionalSettings();
    };

    // 3. Update Price based on Country Selection
    function updateRegionalSettings() {
        const country = document.getElementById('country').value;
        const settings = regionalSettings[country];
        document.getElementById('displayAmount').innerText = `${settings.currency} ${settings.amount}`;
        document.getElementById('phoneHint').innerText = settings.hint;
    }

    // 4. Payment Execution
    async function processPayment() {
        const btn = document.getElementById('payBtn');
        
        // Grab values from inputs
        const paymentData = {
            fname: document.getElementById('fname').value.trim(),
            lname: document.getElementById('lname').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            country: document.getElementById('country').value
        };

        // Basic Validation
        if (!paymentData.fname || !paymentData.email || paymentData.phone.length < 10) {
            alert("Please complete all fields correctly.");
            return;
        }

        btn.innerText = "Requesting Secure Link...";
        btn.disabled = true;

        try {
            const response = await fetch('https://tutor-backend-brqo.onrender.com/initiate-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paymentData)
            });

            if (!response.ok) throw new Error('Backend server is unreachable');

            const result = await response.json();
            
            if (result.redirect_url) {
                window.location.href = result.redirect_url;
            } else {
                throw new Error(result.error || "Payment Gateway Error");
            }
        } catch (error) {
            console.error("Payment Error:", error);
            alert("Connection Failed: The server might be waking up. Please wait 30 seconds and try again.");
            btn.innerText = "Try Again";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
